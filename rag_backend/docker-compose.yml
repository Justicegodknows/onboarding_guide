services:
  api:
    build: .
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ../help:/app/help
      - ../rag-agent-skills:/app/rag-agent-skills
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres
      - CHROMA_URL=http://chroma:8000
      - REDIS_URL=redis://redis:6379/0
      - LLM_API_KEY=${LLM_API_KEY}
      - LM_STUDIO_BASE_URL=http://192.168.18.199:1234
      - LM_STUDIO_MODEL=google/gemma-4-E4B-it
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=gemma4
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NVIDIA_BASE_URL=${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NVIDIA_EMBED_MODEL=${NVIDIA_EMBED_MODEL:-nvidia/llama-nemotron-embed-1b-v2}
      - NVIDIA_CHAT_MODEL=${NVIDIA_CHAT_MODEL:-meta/llama-3.3-70b-instruct}
      - CORS_ORIGINS=${CORS_ORIGINS}
    depends_on:
      - postgres
      - chroma
      - redis
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - /home/admin/app-data/postgres:/var/lib/postgresql/data
  chroma:
    image: chromadb/chroma:0.5.23
    restart: always
    ports:
      - "8100:8000"
    volumes:
      - /home/admin/app-data/chromadb:/chroma/.chroma/index
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - /home/admin/app-data/redis:/data
